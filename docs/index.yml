### YamlMime:Hub
title: Windows AI
summary: >
  Build AI-powered Windows apps using on-device models, NPU acceleration, and cloud APIs.
  Use Windows AI APIs for built-in Copilot+ PC features like Phi Silica and OCR.
  Use Foundry Local to run open-source LLMs on-device. Use Windows ML to deploy
  custom ONNX models with DirectML hardware acceleration. Supports C#, C++, and Python.
