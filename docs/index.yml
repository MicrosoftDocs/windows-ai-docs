conceptualContent:
  title: Microsoft Foundry on Windows
  summary: >
    Integrate AI capabilities into your Windows applications. Use Windows AI APIs for
    built-in features on Copilot+ PCs. Use Foundry Local to run open-source language models
    locally. Use Windows ML to deploy custom ONNX models with DirectML GPU acceleration.
  items:
    # Card
    - title: Windows AI APIs
      summary: Built-in AI features for Copilot+ PCs, including language models, image generation, OCR, and more.
      links:
        - url: /windows/ai/apis/
          itemType: overview
          text: Overview
        - url: /windows/ai/apis/phi-silica
          itemType: overview
          text: Phi Silica
        - url: /windows/ai/apis/imaging
          itemType: overview
          text: Imaging
        - url: /windows/ai/apis/image-generation
          itemType: overview
          text: Image Generation
        - url: /windows/ai/apis/text-recognition
          itemType: overview
          text: Text Recognition (OCR)
        - url: /windows/ai/apis/video-super-resolution
          itemType: overview
          text: Video Super Resolution
      footerLink:
        url: /windows/ai/apis/get-started
        text: See more
    # Card
    - title: Foundry Local
      summary: Run open-source LLMs locally on Windows using the Foundry Local runtime, with no cloud dependency.
      links:
